<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for high clarity -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Glowing subtle backboard -->
  <circle cx="256" cy="256" r="180" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Medical Cross + Capsule Integrated Icon -->
  <g transform="translate(0, 0)">
    <!-- Horizontal Cross bar -->
    <rect x="116" y="216" width="280" height="80" rx="40" fill="url(#primaryGrad)" />
    <!-- Vertical Capsule bar -->
    <rect x="216" y="116" width="80" height="280" rx="40" fill="url(#secondaryGrad)" />
    
    <!-- Center Capsule Accent -->
    <capsule>
      <path d="M216 196 A40 40 0 0 1 296 196 L296 256 L216 256 Z" fill="#ffffff" opacity="0.25" />
    </capsule>

    <!-- Shiny Capsule Line -->
    <path d="M236 146 Q256 136 276 146" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
